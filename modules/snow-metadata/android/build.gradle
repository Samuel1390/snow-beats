apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'com.snowbeats.metadata'
version = '0.2.0'

repositories {
  mavenCentral()
}

android {
  namespace 'com.snowbeats.metadata'
  defaultConfig {
    versionCode 2
    versionName '0.2.0'
  }
}

dependencies {
  // Notificación multimedia clásica MediaStyle y utilidades AndroidX
  implementation 'androidx.media:media:1.7.0'
  implementation 'androidx.core:core-ktx:1.15.0'

  // Motor nativo yt-dlp + FFmpeg para descargas de YouTube, TikTok, Instagram, Facebook y X
  implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
  implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}